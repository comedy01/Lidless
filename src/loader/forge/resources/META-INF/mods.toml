modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/comedy01/Lidless/issues"

[[mods]]
    modId = "lidless"
    version = "${version}"
    displayName = "Lidless"
    displayURL = "https://github.com/comedy01/Lidless"
    logoFile = "assets/lidless/icon.png"
    logoBlur = false
    description = '''See inside chests, barrels, shulker boxes, ender chests, chest boats and pack animals without opening them. Shulker boxes show their contents as a grid in item tooltips. Storage screens get a search box, sorting, deposit matching and take all. Client-side only.'''
    authors = "comedy01"

[[dependencies.lidless]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_range}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.lidless]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${range}"
    ordering = "NONE"
    side = "CLIENT"
